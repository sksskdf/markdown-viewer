<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>MD Viewer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #8a8a8a;
    --line: #ececec;
    --code-bg: #f6f6f6;
    --accent: #3b6ef6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616;
      --fg: #e6e6e6;
      --muted: #7d7d7d;
      --line: #2a2a2a;
      --code-bg: #1f1f1f;
      --accent: #6f93ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  /* hidden 속성이 어떤 display 규칙도 이기도록 — 빈 상태가 안 사라지던 버그 방지 */
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 헤더 (한 줄, 두 상태) ── */
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 52px;
    padding: 0 14px;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .wordmark { font-size: 14px; font-weight: 600; color: var(--muted); padding-left: 6px; }

  /* 탭 스트립 */
  .tabs {
    display: flex;
    align-items: stretch;
    gap: 1px;
    flex: 1;
    min-width: 0;
    height: 100%;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs.overflow {
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
  }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 6px 0 11px;
    font-size: 13px;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    flex: 0 0 auto;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); }
  .tab .label { overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .tab .aff { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: none; }
  .tab.dirty .dot { display: block; }
  .tab .close {
    display: none; width: 16px; height: 16px; padding: 0; border: none; border-radius: 4px;
    align-items: center; justify-content: center; font-size: 15px; line-height: 1;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .tab:hover .dot, .tab:focus-within .dot { display: none; }
  .tab:hover .close, .tab:focus-within .close { display: inline-flex; }
  .tab .close:hover { background: var(--code-bg); color: var(--fg); }
  .tab.drag-src { opacity: .35; }

  /* 오른쪽 고정 컨트롤 */
  .controls { display: flex; align-items: center; gap: 8px; flex: none; margin-left: auto; }
  .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .segmented button { appearance: none; border: none; background: transparent; color: var(--muted); font: inherit; font-size: 12px; padding: 5px 12px; cursor: pointer; }
  .segmented button.active { background: var(--code-bg); color: var(--fg); }
  .open-btn { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  .open-btn:hover { border-color: var(--muted); }

  /* ── 외부 변경 충돌 배너 / 토스트 ── */
  #conflictBar {
    position: sticky;
    top: 52px;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 14px;
    font-size: 13px;
    background: color-mix(in srgb, var(--accent) 10%, var(--bg));
    border-bottom: 1px solid var(--line);
  }
  #conflictBar button { appearance: none; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 7px; cursor: pointer; }
  #conflictBar button:hover { border-color: var(--muted); }
  #conflictBar button.primary { border-color: var(--accent); color: var(--accent); }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    background: var(--fg);
    color: var(--bg);
    font-size: 12.5px;
    padding: 7px 14px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    z-index: 60;
  }
  #toast.show { opacity: .92; }

  /* ── 본문 ── */
  main { max-width: 720px; margin: 0 auto; padding: 44px 24px 120px; }

  /* 편집 textarea — '폼'이 아니라 '글 위의 커서'처럼 */
  #editor {
    display: block;
    width: 100%;
    min-height: calc(100vh - 180px);
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--fg);
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 14px;
    line-height: 1.75;
    tab-size: 4;
    padding: 0;
  }

  /* ── 빈 화면 ── */
  #empty {
    min-height: calc(100vh - 52px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    font-size: 15px;
    user-select: none;
  }
  #empty .icon { font-size: 40px; opacity: .5; }
  #empty .hint { font-size: 13px; transition: color .2s; }

  /* ── 드래그 오버레이 ── */
  body.dragging::after {
    content: "놓으면 열립니다";
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--accent);
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    border: 2px dashed var(--accent);
    z-index: 50;
  }

  /* ── 마크다운 렌더링 ── */
  #content h1, #content h2, #content h3 { line-height: 1.4; margin: 2em 0 .6em; font-weight: 650; }
  #content h1 { font-size: 1.7em; margin-top: 0; }
  #content h2 { font-size: 1.35em; padding-bottom: .3em; border-bottom: 1px solid var(--line); }
  #content h3 { font-size: 1.1em; }
  #content p { margin: .9em 0; }
  #content a { color: var(--accent); text-decoration: none; }
  #content a:hover { text-decoration: underline; }
  #content code { font-family: "JetBrains Mono", Consolas, monospace; font-size: .86em; background: var(--code-bg); padding: .15em .4em; border-radius: 5px; }
  #content pre { background: var(--code-bg); padding: 16px; border-radius: 10px; overflow-x: auto; }
  #content pre code { background: none; padding: 0; font-size: .85em; }
  #content blockquote { margin: 1em 0; padding: .1em 1.2em; border-left: 3px solid var(--line); color: var(--muted); }
  #content ul, #content ol { padding-left: 1.5em; }
  #content li { margin: .3em 0; }
  #content hr { border: none; border-top: 1px solid var(--line); margin: 2.5em 0; }
  #content img { max-width: 100%; border-radius: 8px; }
  #content table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: .92em; }
  #content th, #content td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
  #content th { background: var(--code-bg); font-weight: 600; }
</style>
</head>
<body>

<header>
  <span class="wordmark" id="wordmark">MD Viewer</span>
  <div class="tabs" id="tabs" role="tablist" aria-label="열린 문서" hidden></div>
  <div class="controls">
    <div class="segmented" id="toggle" role="group" aria-label="보기 또는 편집" hidden>
      <button data-mode="view" id="segView" aria-pressed="true">읽기</button>
      <button data-mode="edit" id="segEdit" aria-pressed="false">편집</button>
    </div>
    <button class="open-btn" id="openBtn">열기</button>
  </div>
</header>

<div id="conflictBar" hidden>
  <span>파일이 앱 밖에서 수정되었습니다 — 편집 중인 내용과 겹칩니다.</span>
  <button id="conflictReload" class="primary">디스크 내용으로 교체</button>
  <button id="conflictKeep">내 편집 유지</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<main>
  <div id="empty">
    <div class="icon">⌘</div>
    <div>마크다운 파일을 끌어다 놓으세요</div>
    <div class="hint">또는 우측 상단 [열기]</div>
  </div>
  <article id="content" hidden></article>
  <textarea id="editor" spellcheck="false" hidden></textarea>
</main>

<input type="file" id="fileInput" accept=".md,.markdown,.txt,.mdown,.mkd" multiple hidden>

<script>
/* ───────────── 미니멀 마크다운 파서 (외부 의존성 없음) ───────────── */
function md(src) {
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  const safeUrl = u => /^\s*(javascript|data|vbscript):/i.test(u) ? "#" : u;   // 위험 스킴 차단
  src = src.replace(/\u0000/g, "");                                            // 센티넬 주입 방지

  // 펜스 코드블록: 줄 시작/끝 앵커, 비출력 센티넬로 분리
  const blocks = [];
  src = src.replace(/^```(\w*)\n([\s\S]*?)\n```$/gm, (_, lang, code) => {
    blocks.push(`<pre><code>${esc(code)}</code></pre>`);
    return `\u0000B${blocks.length - 1}\u0000`;
  });

  const inline = s => {
    const codes = [];
    // 인라인 코드 먼저 추출(강조/링크 치환에 안 깨지도록), 내용은 즉시 이스케이프
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(`<code>${esc(c)}</code>`); return `\u0000C${codes.length - 1}\u0000`; });
    return esc(s)
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, a, u) => `<img alt="${a}" src="${safeUrl(u)}">`)
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${safeUrl(u)}" target="_blank" rel="noopener">${t}</a>`)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/~~([^~]+)~~/g, "<del>$1</del>")
      .replace(/\u0000C(\d+)\u0000/g, (_, n) => codes[+n]);   // 코드 복원(마지막)
  };

  const lines = src.split("\n");
  let html = "", para = [], list = null;
  const flushPara = () => { if (para.length) { html += `<p>${inline(para.join(" "))}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`; list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^\u0000B(\d+)\u0000$/))) { flushPara(); flushList(); if (blocks[+m[1]] !== undefined) html += blocks[+m[1]]; continue; }
    if ((m = line.match(/^(#{1,6})\s+(.+)/))) { flushPara(); flushList(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); flushList(); html += "<hr>"; continue; }
    if ((m = line.match(/^>\s?(.*)/))) { flushPara(); flushList(); html += `<blockquote><p>${inline(m[1])}</p></blockquote>`; continue; }
    if ((m = line.match(/^[-*+]\s+(.+)/))) { flushPara(); if (!list || list.tag !== "ul") { flushList(); list = { tag: "ul", items: [] }; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^\d+\.\s+(.+)/))) { flushPara(); if (!list || list.tag !== "ol") { flushList(); list = { tag: "ol", items: [] }; } list.items.push(m[1]); continue; }
    if (line.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes("-")) {
      flushPara(); flushList();
      const cells = r => r.split("|").map(c => c.trim()).filter((c, j, a) => !(c === "" && (j === 0 || j === a.length - 1)));
      let t = `<table><thead><tr>${cells(line).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>`;
      i++;
      while (i + 1 < lines.length && lines[i + 1].includes("|")) { i++; t += `<tr>${cells(lines[i]).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`; }
      html += t + "</tbody></table>";
      continue;
    }
    if (line.trim() === "") { flushPara(); flushList(); continue; }
    flushList(); para.push(line.trim());
  }
  flushPara(); flushList();
  return html;
}

/* ───────────── 상태 ───────────── */
const $ = id => document.getElementById(id);
const els = {
  wordmark: $("wordmark"), tabs: $("tabs"), toggle: $("toggle"),
  segView: $("segView"), segEdit: $("segEdit"), openBtn: $("openBtn"),
  empty: $("empty"), content: $("content"), editor: $("editor"), fileInput: $("fileInput"),
  conflictBar: $("conflictBar"), conflictReload: $("conflictReload"), conflictKeep: $("conflictKeep"), toast: $("toast"),
};

let tabs = [];          // { id, name, raw, savedRaw, mode:'view'|'edit', scrollTop, selStart, selEnd, editorScroll, handle, lastModified, externalChanged }
let activeId = null;
let programmaticScroll = false;
let hintTimer = null;
let dragTabId = null;   // 재정렬 드래그 중인 탭 id — 파일 드롭 오버레이와 구분용
const SESSION_KEY = "mdv:session";
const FIRSTRUN_KEY = "mdv:firstRunShown";
let saveTimer = null;

const uid = () => "t" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
const active = () => tabs.find(t => t.id === activeId) || null;
const isDirty = t => t.raw !== t.savedRaw;

/* ───────────── 렌더 ───────────── */
function render() {
  const has = tabs.length > 0;
  els.wordmark.hidden = has;
  els.tabs.hidden = !has;
  els.toggle.hidden = !has;
  els.empty.hidden = has;

  if (!has) {
    els.content.hidden = true;
    els.editor.hidden = true;
    els.conflictBar.hidden = true;
    document.title = "MD Viewer";
    renderTabs();
    return;
  }

  const t = active();
  renderTabs();
  els.conflictBar.hidden = !t.externalChanged;
  els.segView.classList.toggle("active", t.mode === "view");
  els.segEdit.classList.toggle("active", t.mode === "edit");
  els.segView.setAttribute("aria-pressed", t.mode === "view" ? "true" : "false");
  els.segEdit.setAttribute("aria-pressed", t.mode === "edit" ? "true" : "false");
  document.title = (isDirty(t) ? "• " : "") + t.name + " — MD Viewer";

  if (t.mode === "edit") {
    els.content.hidden = true;
    els.editor.hidden = false;
    if (els.editor.value !== t.raw) els.editor.value = t.raw;
    els.editor.selectionStart = t.selStart ?? 0;
    els.editor.selectionEnd = t.selEnd ?? 0;
    els.editor.scrollTop = t.editorScroll || 0;
  } else {
    els.editor.hidden = true;
    els.content.hidden = false;
    els.content.innerHTML = md(t.raw);
    const maxY = Math.max(0, document.documentElement.scrollHeight - innerHeight);
    programmaticScroll = true;                              // 복원 스크롤이 listener에 되먹임되지 않도록
    window.scrollTo(0, Math.min(t.scrollTop || 0, maxY));
    requestAnimationFrame(() => { programmaticScroll = false; });
  }
}

function renderTabs() {
  els.tabs.innerHTML = "";
  for (const t of tabs) {
    const el = document.createElement("div");
    el.className = "tab" + (t.id === activeId ? " active" : "") + (isDirty(t) ? " dirty" : "");
    el.dataset.id = t.id;
    el.title = t.name;
    el.tabIndex = 0;
    el.draggable = true;
    el.setAttribute("role", "tab");
    el.setAttribute("aria-selected", t.id === activeId ? "true" : "false");
    el.setAttribute("aria-label", t.name + (isDirty(t) ? " (수정됨)" : ""));
    el.innerHTML = `<span class="label"></span><span class="aff"><span class="dot"></span><button class="close" aria-label="닫기" tabindex="-1">×</button></span>`;
    el.querySelector(".label").textContent = t.name;
    els.tabs.appendChild(el);
  }
  els.tabs.classList.toggle("overflow", els.tabs.scrollWidth > els.tabs.clientWidth + 1);
  const act = els.tabs.querySelector(".tab.active");
  if (act) act.scrollIntoView({ inline: "nearest", block: "nearest" });
}

/* ───────────── 탭 조작 ───────────── */
async function addTab(name, raw, handle, lastModified) {
  // 중복 열기 방지: 같은 핸들(우선) 또는 같은 이름의 '깨끗한' 탭이 있으면 재사용
  let existing = null;
  if (handle && handle.isSameEntry) {
    for (const t of tabs) { if (t.handle && await t.handle.isSameEntry(handle)) { existing = t; break; } }
  }
  if (!existing) existing = tabs.find(t => t.name === name && !isDirty(t));
  if (existing) {
    if (!isDirty(existing)) { existing.raw = raw; existing.savedRaw = raw; existing.externalChanged = false; }   // 미저장 편집은 보존
    else if (raw !== existing.raw) existing.externalChanged = true;            // 편집본과 디스크가 다르면 충돌 알림
    if (handle) { existing.handle = handle; existing.lastModified = lastModified ?? existing.lastModified; putHandle(existing.id, handle); watchHandle(handle); }
    activeId = existing.id;
    saveSession();
    render();
    return;
  }
  const t = { id: uid(), name, raw, savedRaw: raw, mode: "view", scrollTop: 0, selStart: 0, selEnd: 0, editorScroll: 0, handle: handle || null, lastModified: handle ? (lastModified ?? null) : null, externalChanged: false };
  if (handle) { putHandle(t.id, handle); watchHandle(handle); }
  tabs.push(t);
  activeId = t.id;
  saveSession();
  render();
}

function activateTab(id) {
  if (id === activeId) return;
  snapshotScroll();
  activeId = id;
  saveSession();
  render();
}

function closeTab(id) {
  const i = tabs.findIndex(t => t.id === id);
  if (i < 0) return;
  if (isDirty(tabs[i]) && !confirm("저장하지 않은 변경사항이 있습니다. 닫을까요?")) return;
  const wasActive = id === activeId;
  if (fsObserver && tabs[i].handle) { try { fsObserver.unobserve(tabs[i].handle); } catch (e) {} }
  tabs.splice(i, 1);
  delHandle(id);
  if (wasActive) {
    const next = tabs[i] || tabs[i - 1] || null;   // 오른쪽 이웃 → 없으면 왼쪽
    activeId = next ? next.id : null;
  }
  saveSession();
  render();
}

function setMode(mode) {
  const t = active();
  if (!t || t.mode === mode) return;
  snapshotScroll();                 // 떠나는 모드 상태(보기 스크롤/편집 캐럿) 보존
  t.mode = mode;
  saveSession();
  render();
  if (mode === "edit") requestAnimationFrame(() => els.editor.focus());
}

function snapshotScroll() {
  const t = active();
  if (!t) return;
  if (t.mode === "view") {
    t.scrollTop = window.scrollY;
  } else {
    t.selStart = els.editor.selectionStart;
    t.selEnd = els.editor.selectionEnd;
    t.editorScroll = els.editor.scrollTop;
  }
}

/* ───────────── 파일 열기 ───────────── */
const isText = name => /\.(md|markdown|mdown|mkd|txt|text)$/i.test(name);
const hasExt = name => /\.[a-z0-9]+$/i.test(name);
// 마크다운/텍스트 확장자, text/* MIME, 또는 확장자·MIME 모두 없는 파일(README 등)만 허용
const acceptable = f => isText(f.name) || (f.type && f.type.startsWith("text")) || (!hasExt(f.name) && !f.type);

function flashEmptyHint(msg) {
  const hint = els.empty.querySelector(".hint");
  if (!hint) return;
  hint.textContent = msg;
  hint.style.color = "var(--accent)";
  if (hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hint.textContent = "또는 우측 상단 [열기]"; hint.style.color = ""; }, 2600);
}

let toastTimer = null;
function showToast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove("show"), 2200);
}

async function openViaPicker() {
  if (window.showOpenFilePicker) {
    try {
      const handles = await window.showOpenFilePicker({
        multiple: true,
        types: [{ description: "Markdown", accept: { "text/markdown": [".md", ".markdown", ".mdown", ".mkd"], "text/plain": [".txt"] } }],
      });
      for (const h of handles) { const f = await h.getFile(); await addTab(f.name, await f.text(), h, f.lastModified); }
    } catch (e) { if (e.name !== "AbortError") console.error(e); }
  } else {
    els.fileInput.click();
  }
}

async function openFileList(fileList) {
  let added = 0;
  for (const f of fileList) { if (acceptable(f)) { await addTab(f.name, await f.text(), null); added++; } }
  return added;
}

async function openFromDrop(dt) {
  const before = tabs.length;
  const items = dt.items;
  if (items && items.length && items[0].getAsFileSystemHandle) {
    for (const it of items) {
      if (it.kind !== "file") continue;
      const h = await it.getAsFileSystemHandle();
      if (!h || h.kind !== "file") continue;        // 폴더(directory)는 건너뜀
      const f = await h.getFile();
      if (acceptable(f)) await addTab(f.name, await f.text(), h, f.lastModified);
    }
  } else {
    await openFileList(dt.files);
  }
  if (tabs.length === before) {
    console.warn("드롭한 항목에서 열 수 있는 파일을 찾지 못했습니다 (폴더는 미지원).");
    flashEmptyHint("열 수 있는 마크다운/텍스트 파일이 없어요 (폴더 미지원)");
  }
}

/* ───────────── 저장 / 내보내기 ───────────── */
// 복원된 핸들은 쓰기 권한이 풀려 있을 수 있음 → Ctrl+S(사용자 제스처) 시점에 재요청
async function ensureWritable(h) {
  const opts = { mode: "readwrite" };
  try {
    if (h.queryPermission && await h.queryPermission(opts) === "granted") return true;
    if (h.requestPermission) return await h.requestPermission(opts) === "granted";
  } catch (e) {}
  return true;   // 권한 API가 없으면 createWritable 시도에 맡김
}

async function saveActive() {
  const t = active();
  if (!t) return;
  if (t.handle && t.handle.createWritable) {        // File System Access → 원본에 진짜 저장
    try {
      if (await ensureWritable(t.handle)) {
        const w = await t.handle.createWritable();
        await w.write(t.raw);
        await w.close();
        t.savedRaw = t.raw;
        t.externalChanged = false;                              // 내 저장이 최신 — 충돌 해소
        try { t.lastModified = (await t.handle.getFile()).lastModified; } catch (e) {}   // 자체 저장을 외부 변경으로 오인하지 않도록
        saveSession();
        render();
        return;
      }
    } catch (e) { console.warn("원본 저장 실패 → 다운로드로 폴백", e); }
  }
  downloadMd(t);                                    // 폴백: .md 내보내기(= 디스크 사본 저장으로 간주)
  t.savedRaw = t.raw;
  saveSession();
  render();
}

function downloadMd(t) {
  const blob = new Blob([t.raw], { type: "text/markdown" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = /\.[a-z0-9]+$/i.test(t.name) ? t.name : t.name + ".md";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ───────────── 외부 변경 실시간 동기화 ─────────────
   핸들이 있는 탭은 디스크의 lastModified를 주기적으로 대조하고,
   FileSystemObserver 지원 브라우저에서는 변경 즉시 반영한다.
   편집 중(dirty)인 탭은 덮어쓰지 않고 충돌 배너로 사용자가 선택. */
const SYNC_INTERVAL = 2000;
let syncing = false;

async function reconcileTab(t) {
  if (!t.handle) return;
  try {
    if (t.handle.queryPermission && await t.handle.queryPermission({ mode: "read" }) !== "granted") return;
    const f = await t.handle.getFile();
    if (f.lastModified === t.lastModified) return;
    const text = await f.text();
    t.lastModified = f.lastModified;
    if (text === t.raw) {                                   // 내용 동일(자체 저장 직후, 무의미한 touch 등) — 상태만 정리
      if (t.savedRaw !== text) { t.savedRaw = text; t.externalChanged = false; saveSession(); if (t.id === activeId) render(); }
      return;
    }
    if (!isDirty(t)) {                                      // 편집 안 한 탭 → 조용히 새 내용 반영
      t.raw = t.savedRaw = text;
      t.externalChanged = false;
      saveSession();
      if (t.id === activeId) { render(); showToast("파일이 밖에서 수정되어 새로 불러왔습니다"); }
    } else {                                                // 편집 중 → 덮어쓰지 않고 충돌 배너
      t.externalChanged = true;
      if (t.id === activeId) render();
    }
  } catch (e) { /* 파일 삭제·이동·일시적 읽기 실패 — 다음 확인 때 재시도 */ }
}

async function checkExternal() {
  if (syncing) return;                                      // 겹침 방지
  syncing = true;
  try { for (const t of [...tabs]) await reconcileTab(t); }
  finally { syncing = false; }
}

let fsObserver = null;
if ("FileSystemObserver" in window) {
  try { fsObserver = new FileSystemObserver(() => checkExternal()); } catch (e) {}
}
function watchHandle(h) {
  if (!fsObserver) return;                                  // 미지원이면 폴링만으로 동작
  try { Promise.resolve(fsObserver.observe(h)).catch(() => {}); } catch (e) {}
}

setInterval(() => { if (!document.hidden) checkExternal(); }, SYNC_INTERVAL);
addEventListener("focus", () => checkExternal());           // 다른 앱에서 고치고 돌아온 순간 바로 반영
addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkExternal(); });

/* ───────────── 파일 핸들 영속 (IndexedDB) ─────────────
   localStorage는 FileSystemFileHandle을 못 담지만 IndexedDB는 담을 수 있음 →
   앱을 껐다 켜도 Ctrl+S가 원본 파일에 저장된다. */
function idbStore(mode) {
  return new Promise((res, rej) => {
    const req = indexedDB.open("mdv-handles", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("handles");
    req.onsuccess = () => {
      const tx = req.result.transaction("handles", mode);
      tx.oncomplete = () => req.result.close();
      res(tx.objectStore("handles"));
    };
    req.onerror = () => rej(req.error);
  });
}
const idbReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const putHandle = (id, h) => idbStore("readwrite").then(s => idbReq(s.put(h, id))).catch(() => {});
const delHandle = id => idbStore("readwrite").then(s => idbReq(s.delete(id))).catch(() => {});
async function restoreHandles() {
  try {
    const s = await idbStore("readonly");
    const [keys, vals] = await Promise.all([idbReq(s.getAllKeys()), idbReq(s.getAll())]);
    const stale = [];
    keys.forEach((k, i) => {
      const t = tabs.find(t => t.id === k);
      if (t && vals[i] && vals[i].kind === "file") { t.handle = vals[i]; watchHandle(t.handle); }
      else stale.push(k);                            // 닫힌 탭의 핸들은 정리
    });
    if (stale.length) { const w = await idbStore("readwrite"); stale.forEach(k => w.delete(k)); }
    checkExternal();                                 // 복원 직후 디스크와 즉시 대조 (권한 없으면 조용히 건너뜀)
  } catch (e) { /* IndexedDB 불가(file:// 등) → 다운로드 저장으로 폴백 */ }
}

/* ───────────── 세션 영속 (localStorage) ───────────── */
function saveSession() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 400);
}
function persist() {
  try {
    snapshotScroll();
    const data = { activeId, tabs: tabs.map(t => ({ id: t.id, name: t.name, raw: t.raw, savedRaw: t.savedRaw, mode: t.mode, scrollTop: t.scrollTop, selStart: t.selStart, selEnd: t.selEnd, editorScroll: t.editorScroll })) };
    localStorage.setItem(SESSION_KEY, JSON.stringify(data));   // handle은 IndexedDB에 별도 보관 (putHandle/restoreHandles)
  } catch (e) {
    console.warn("세션 저장 실패(저장 용량 초과 가능) — 편집 내용이 영구 보관되지 않을 수 있습니다.", e);
  }
}
function loadSession() {
  try {
    const data = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
    if (!data || !data.tabs || !data.tabs.length) return false;
    tabs = data.tabs.map(t => ({ scrollTop: 0, selStart: 0, selEnd: 0, editorScroll: 0, ...t, handle: null, lastModified: null, externalChanged: false }));
    activeId = tabs.some(t => t.id === data.activeId) ? data.activeId : tabs[0].id;
    restoreHandles();                                // 비동기 — 핸들은 잠시 뒤 재연결됨
    return true;
  } catch (e) { return false; }
}

/* ───────────── 이벤트 ───────────── */
els.openBtn.onclick = openViaPicker;
els.fileInput.onchange = e => { openFileList(e.target.files); e.target.value = ""; };
els.segView.onclick = () => setMode("view");
els.segEdit.onclick = () => setMode("edit");

// 외부 변경 충돌 배너: 디스크 내용으로 교체(내 편집 폐기) / 내 편집 유지(이번 변경 건 무시)
els.conflictReload.onclick = async () => {
  const t = active();
  if (!t || !t.handle) return;
  try {
    const f = await t.handle.getFile();
    t.raw = t.savedRaw = await f.text();
    t.lastModified = f.lastModified;
    t.externalChanged = false;
    saveSession();
    render();
  } catch (e) { showToast("디스크에서 다시 읽지 못했습니다"); }
};
els.conflictKeep.onclick = () => {
  const t = active();
  if (!t) return;
  t.externalChanged = false;                        // 다음 외부 변경이 생기면 다시 알림
  render();
};

els.tabs.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  if (e.target.closest(".close")) closeTab(tab.dataset.id);
  else activateTab(tab.dataset.id);
});

// 탭 키보드 조작 (접근성): Enter/Space 활성화, Delete/Backspace 닫기, ←/→ 포커스 이동, Ctrl+←/→ 순서 이동
els.tabs.addEventListener("keydown", e => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activateTab(tab.dataset.id); }
  else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); closeTab(tab.dataset.id); }
  else if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    const i = tabs.findIndex(t => t.id === tab.dataset.id);
    const j = e.key === "ArrowRight" ? i + 1 : i - 1;
    if (i < 0 || j < 0 || j >= tabs.length) return;
    [tabs[i], tabs[j]] = [tabs[j], tabs[i]];
    saveSession();
    renderTabs();
    const el = els.tabs.querySelector(`.tab[data-id="${tab.dataset.id}"]`);
    if (el) el.focus();
  }
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault();
    const all = [...els.tabs.querySelectorAll(".tab")];
    const i = all.indexOf(tab);
    const next = all[e.key === "ArrowRight" ? (i + 1) % all.length : (i - 1 + all.length) % all.length];
    if (next) next.focus();
  }
});

// 탭 드래그 재정렬: 드래그 중엔 DOM 노드만 옮기고(같은 노드 유지 — 드래그가 안 끊기게), 끝나면 순서를 상태에 반영
els.tabs.addEventListener("dragstart", e => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  dragTabId = tab.dataset.id;
  tab.classList.add("drag-src");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", tab.dataset.id);   // Firefox는 데이터가 있어야 드래그가 시작됨
});
els.tabs.addEventListener("dragover", e => {
  if (!dragTabId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  const src = els.tabs.querySelector(".tab.drag-src");
  if (!src) return;
  const over = e.target.closest(".tab");
  if (over && over !== src) {
    const r = over.getBoundingClientRect();
    els.tabs.insertBefore(src, e.clientX < r.left + r.width / 2 ? over : over.nextSibling);
  } else if (!over) {
    const last = els.tabs.lastElementChild;
    if (last && last !== src && e.clientX > last.getBoundingClientRect().right) els.tabs.appendChild(src);
  }
});
els.tabs.addEventListener("drop", e => { if (dragTabId) { e.preventDefault(); e.stopPropagation(); } });
els.tabs.addEventListener("dragend", () => {
  if (!dragTabId) return;
  dragTabId = null;
  const order = [...els.tabs.querySelectorAll(".tab")].map(el => el.dataset.id);
  tabs.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  saveSession();
  renderTabs();                                     // drag-src 제거 겸 재그림
});

// 편집 입력 → raw 갱신 + dirty 표시 + 자동저장
els.editor.addEventListener("input", () => {
  const t = active();
  if (!t) return;
  t.raw = els.editor.value;
  const tabEl = els.tabs.querySelector(`.tab[data-id="${t.id}"]`);
  if (tabEl) { tabEl.classList.toggle("dirty", isDirty(t)); tabEl.setAttribute("aria-label", t.name + (isDirty(t) ? " (수정됨)" : "")); }
  document.title = (isDirty(t) ? "• " : "") + t.name + " — MD Viewer";
  saveSession();
});

// 편집 중 Tab → 들여쓰기 삽입 / Esc → 보기
els.editor.addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    const s = els.editor.selectionStart, en = els.editor.selectionEnd;
    els.editor.value = els.editor.value.slice(0, s) + "\t" + els.editor.value.slice(en);
    els.editor.selectionStart = els.editor.selectionEnd = s + 1;
    els.editor.dispatchEvent(new Event("input"));
  } else if (e.key === "Escape") {
    setMode("view");
  }
});

// 보기 스크롤 위치 추적 (복원 중 프로그램 스크롤은 무시 → 저장값 오염 방지)
window.addEventListener("scroll", () => {
  if (programmaticScroll) return;
  const t = active();
  if (t && t.mode === "view") t.scrollTop = window.scrollY;
}, { passive: true });

// 파일 드래그앤드롭 — 탭 재정렬 드래그와 구분: 파일을 끌 때만 오버레이/열기
const hasFiles = dt => dt && [...dt.types].includes("Files");
window.addEventListener("dragover", e => {
  e.preventDefault();
  if (!dragTabId && hasFiles(e.dataTransfer)) document.body.classList.add("dragging");
});
window.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dragging"); });
window.addEventListener("drop", e => {
  e.preventDefault();
  document.body.classList.remove("dragging");
  if (!dragTabId && hasFiles(e.dataTransfer)) openFromDrop(e.dataTransfer);
});

// 단축키 (일부는 PWA 독립창에서만 — 일반 브라우저 단축키 가로채지 않도록)
const standalone = matchMedia("(display-mode: standalone)").matches;
window.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === "e") { e.preventDefault(); const t = active(); if (t) setMode(t.mode === "edit" ? "view" : "edit"); }
  else if (k === "s") { e.preventDefault(); saveActive(); }
  else if (k === "o") { e.preventDefault(); openViaPicker(); }
  else if (k === "w" && standalone) { e.preventDefault(); if (activeId) closeTab(activeId); }
  else if (k === "tab" && standalone) {
    e.preventDefault();
    if (tabs.length < 2) return;
    const i = tabs.findIndex(t => t.id === activeId);
    const next = e.shiftKey ? (i - 1 + tabs.length) % tabs.length : (i + 1) % tabs.length;
    activateTab(tabs[next].id);
  }
});

// 닫기/백그라운드 전 즉시 저장
addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") persist(); });
addEventListener("pagehide", persist);

// PWA 파일 핸들러: .md 더블클릭으로 앱 실행 시 (manifest file_handlers 추가되면 동작)
if ("launchQueue" in window) {
  launchQueue.setConsumer(async params => {
    if (!params.files || !params.files.length) return;
    for (const h of params.files) { const f = await h.getFile(); await addTab(f.name, await f.text(), h, f.lastModified); }
  });
}

// 서비스워커 등록 (오프라인) — file://에서는 건너뜀. updateViaCache:none → sw.js가 HTTP 캐시에 안 걸려 배포가 바로 감지됨
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(e => console.warn("SW 등록 실패", e)));
}

/* ───────────── 시작 ───────────── */

- 변경된 탭을 닫으면 확인창이 뜹니다
`;

if (!loadSession() && !localStorage.getItem(FIRSTRUN_KEY)) {
  // 첫 실행만: 멀티탭/편집을 바로 체험하도록 데모 두 개 (모두 닫으면 빈 화면, 재실행 시엔 안 뜸)
  const mk = (name, raw) => ({ id: uid(), name, raw, savedRaw: raw, mode: "view", scrollTop: 0, selStart: 0, selEnd: 0, editorScroll: 0, handle: null });
  tabs = [mk("welcome.md", WELCOME), mk("sample.md", SAMPLE)];
  activeId = tabs[0].id;
  try { localStorage.setItem(FIRSTRUN_KEY, "1"); } catch (e) {}
}
render();
</script>
